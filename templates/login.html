<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>RACE REVA – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #4f46e5; --accent-dark: #4338ca; --accent-light: #eef2ff;
      --text: #111827; --text-2: #6b7280; --border: #e5e7eb;
      --bg: #f0f2ff; --white: #ffffff; --danger: #ef4444; --success: #10b981;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      padding: 40px 36px 32px;
      text-align: center;
      color: #fff;
    }
    .login-header .logo-icon {
      width: 60px; height: 60px;
      background: rgba(255,255,255,.2);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }
    .login-header h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .login-header p { font-size: 13px; opacity: .8; }

    .login-body { padding: 32px 36px 36px; }

    .tabs {
      display: flex;
      background: #f8fafc;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 9px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-2);
      transition: all .2s;
    }
    .tab-btn.active { background: var(--white); color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.1); }

    .form-panel { display: none; }
    .form-panel.active { display: block; }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-2);
      font-size: 14px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      background: #fafafa;
    }
    input:focus { border-color: var(--accent); background: #fff; }
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
      margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover { opacity: .9; }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .success-msg {
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .divider { text-align: center; color: var(--text-2); font-size: 12px; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">🎓</div>
      <h1>RACE REVA</h1>
      <p>College Attendance Management System</p>
    </div>
    <div class="login-body">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-panel active" id="panel-login">
        <div class="error-msg" id="login-error"></div>
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username"/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password"/>
          </div>
        </div>
        <button class="btn-submit" id="login-btn" onclick="doLogin()">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-panel" id="panel-register">
        <div class="error-msg" id="register-error"></div>
        <div class="success-msg" id="register-success"></div>
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrap">
            <i class="fa-solid fa-id-card"></i>
            <input type="text" id="reg-name" placeholder="Your full name"/>
          </div>
        </div>
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="reg-username" placeholder="Choose a username"/>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="reg-password" placeholder="Create a password"/>
          </div>
        </div>
        <button class="btn-submit" id="register-btn" onclick="doRegister()">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </div>
    </div>
  </div>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
      b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-register').classList.toggle('active', tab === 'register');
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }
  function hideMsg(id) { document.getElementById(id).style.display = 'none'; }

  async function doLogin() {
    hideMsg('login-error');
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    if (!username || !password) { showError('login-error', 'Please fill in all fields.'); return; }
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const d = await res.json();
      showError('login-error', d.message || 'Login failed.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
    }
  }

  async function doRegister() {
    hideMsg('register-error');
    hideMsg('register-success');
    const name = document.getElementById('reg-name').value.trim();
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!name || !username || !password) { showError('register-error', 'Please fill in all fields.'); return; }
    const btn = document.getElementById('register-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account…';
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, username, password })
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      const d = await res.json();
      showError('register-error', d.message || 'Registration failed.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
    }
  }

  // Allow Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const activePanel = document.querySelector('.form-panel.active').id;
      if (activePanel === 'panel-login') doLogin();
      else doRegister();
    }
  });
</script>
</body>
</html>
